[package]
name = "wax-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "waX VPN command line interface"

[[bin]]
name = "wax"
path = "src/main.rs"

[dependencies]
wax-diagnostics = { path = "../wax-diagnostics" }
wax-core = { path = "../wax-core" }
wax-warp = { path = "../wax-warp" }
wax-tunnel = { path = "../wax-tunnel" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
