[package]
name = "wax-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core WireGuard profile, key and config logic for waX VPN"

[dependencies]
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "getrandom"] }
base64 = "0.23"
ipnet = "2"
dirs = "7"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
