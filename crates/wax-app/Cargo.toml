[package]
name = "wax-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "waX VPN - WireGuard client for Windows"

[[bin]]
name = "wax-vpn"
path = "src/main.rs"

[dependencies]
wax-core = { path = "../wax-core" }
wax-warp = { path = "../wax-warp" }
wax-tunnel = { path = "../wax-tunnel" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
