name: performance sample

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Completed build run containing candidate wax-vpn-binaries'
        required: true
        type: string
      baseline_run_id:
        description: 'Completed baseline build run (v0.1.41 by default)'
        required: true
        default: '43013058134'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  sample:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download candidate binaries
        uses: actions/download-artifact@v4
        with:
          name: wax-vpn-binaries
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download baseline binaries
        uses: actions/download-artifact@v4
        with:
          name: wax-vpn-binaries
          path: baseline
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sample disconnected startup and idle process cost
        shell: powershell
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          BASELINE_RUN: ${{ inputs.baseline_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class NativePerf {
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
          }
          "@
          if (Get-Process wax-vpn -ErrorAction SilentlyContinue) { throw 'Unexpected pre-existing GUI process' }
          $bins = @{}
          foreach ($label in @('baseline','candidate')) {
            $dir = Join-Path $PWD "$label-bin"
            New-Item $dir -ItemType Directory -Force | Out-Null
            Copy-Item "$label\target\release\wax-vpn.exe" $dir
            Copy-Item "$label\target\release\wax.exe" $dir
            Copy-Item "$label\installer\payload\wireguard.dll" $dir
            $bins[$label] = Join-Path $dir 'wax-vpn.exe'
          }
          $config = Join-Path $env:APPDATA 'wax-vpn'
          New-Item $config -ItemType Directory -Force | Out-Null
          '{"auto_reconnect":false,"reduced_motion":false,"autostart":false}' | Set-Content (Join-Path $config 'settings.json') -Encoding ASCII
          # A generated, local-only profile exercises selected-profile rendering.
          # No Connect is pressed, no tunnel is created, no WARP registration.
          $cli = Join-Path $PWD 'candidate-bin\wax.exe'
          $keyout = & $cli keygen
          if ($LASTEXITCODE -ne 0) { throw 'Fixture key generation failed' }
          $priv = ($keyout | Select-String 'PrivateKey = (.+)$').Matches[0].Groups[1].Value.Trim()
          $pub = ($keyout | Select-String 'PublicKey\s+= (.+)$').Matches[0].Groups[1].Value.Trim()
          @('[Interface]',"PrivateKey = $priv",'Address = 10.99.0.2/32','','[Peer]',"PublicKey = $pub",'Endpoint = 127.0.0.1:9','AllowedIPs = 0.0.0.0/0') | Set-Content fixture.conf -Encoding ASCII
          & $cli import fixture.conf --name 'Performance sample' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Fixture import failed' }
          Remove-Item fixture.conf
          $priv = $null; $keyout = $null
          $desktop = [System.Windows.Automation.AutomationElement]::RootElement
          $samples = @()
          $metadata = [ordered]@{
            baseline_run = $env:BASELINE_RUN
            candidate_run = $env:CANDIDATE_RUN
            logical_processors = [Environment]::ProcessorCount
            os = [Environment]::OSVersion.VersionString
            runner_image = $env:ImageVersion
            scope = 'Three alternating-order rounds, one generated profile, disconnected, default motion. Shared hosted runner observations, not a user-PC benchmark. Startup includes process creation and 100ms UIA polling, not first-pixel latency. CPU percentage is one logical core equivalent. Working set/private bytes are process snapshots at sample end, not whole-system RAM savings.'
            baseline_sha256 = (Get-FileHash $bins.baseline -Algorithm SHA256).Hash.ToLower()
            candidate_sha256 = (Get-FileHash $bins.candidate -Algorithm SHA256).Hash.ToLower()
          }
          $metadata | ConvertTo-Json | Set-Content performance-metadata.json -Encoding UTF8
          function Capture($window, $name) {
            $r = $window.Current.BoundingRectangle
            $im = New-Object Drawing.Bitmap([int]$r.Width,[int]$r.Height)
            $g = [Drawing.Graphics]::FromImage($im)
            try { $g.CopyFromScreen([int]$r.X,[int]$r.Y,0,0,$im.Size); $im.Save((Join-Path $PWD $name)) }
            finally { $g.Dispose(); $im.Dispose() }
          }
          function IdleSample($p, $label, $round, $mode, $startup) {
            $p.Refresh(); $cpu0 = $p.TotalProcessorTime.TotalMilliseconds
            $clock = [Diagnostics.Stopwatch]::StartNew()
            Start-Sleep -Seconds 10
            $clock.Stop(); $p.Refresh()
            if ($p.HasExited) { throw 'GUI exited during idle sample' }
            $delta = $p.TotalProcessorTime.TotalMilliseconds - $cpu0
            [pscustomobject]@{
              label=$label; round=$round; mode=$mode; pid=$p.Id
              startup_visible_rail_ms=$startup
              wall_ms=$clock.Elapsed.TotalMilliseconds
              process_cpu_ms=$delta
              one_core_cpu_percent=100*$delta/$clock.Elapsed.TotalMilliseconds
              working_set_bytes=$p.WorkingSet64
              private_bytes=$p.PrivateMemorySize64
            }
          }
          for ($round=1; $round -le 3; $round++) {
            $order = if ($round % 2 -eq 1) { @('baseline','candidate') } else { @('candidate','baseline') }
            foreach ($label in $order) {
              $clock = [Diagnostics.Stopwatch]::StartNew()
              $p = Start-Process $bins[$label] -PassThru
              try {
                $window = $null; $rail = $null
                $pidCondition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty,$p.Id)
                $railCondition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty,'Profiles')
                while ($clock.Elapsed.TotalSeconds -lt 20) {
                  if ($p.HasExited) { throw 'GUI exited before visible rail' }
                  $window = $desktop.FindFirst([System.Windows.Automation.TreeScope]::Children,$pidCondition)
                  if ($window -and -not $window.Current.IsOffscreen) {
                    $rail = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$railCondition)
                    if ($rail) { break }
                  }
                  Start-Sleep -Milliseconds 100
                }
                if (-not $rail) { throw 'Original GUI process has no visible window/rail in 20s' }
                $clock.Stop(); $startup=$clock.Elapsed.TotalMilliseconds
                $mainHandle=$window.Current.NativeWindowHandle
                Start-Sleep -Seconds 3
                if ($round -eq 1) { Capture $window "performance-$label-visible.png" }
                $samples += IdleSample $p $label $round 'visible' $startup
                # WM_CLOSE uses the real close-to-tray path, not force hiding.
                [NativePerf]::PostMessage([IntPtr]$mainHandle,0x0010,[IntPtr]::Zero,[IntPtr]::Zero) | Out-Null
                Start-Sleep -Seconds 2
                $window = $desktop.FindFirst([System.Windows.Automation.TreeScope]::Children,$pidCondition)
                if ($window -and -not $window.Current.IsOffscreen) { throw 'Close did not hide original GUI window' }
                $samples += IdleSample $p $label $round 'hidden' $startup
                $samples | ConvertTo-Json | Set-Content performance-samples.json -Encoding UTF8
              } finally {
                & $bins[$label] --quit
                if (-not $p.WaitForExit(10000)) { $p.Kill(); throw 'Performance GUI did not quit cleanly' }
              }
            }
          }
          if (Get-NetAdapter -Name 'waX VPN' -ErrorAction SilentlyContinue) { throw 'Unexpected VPN adapter after disconnected measurement' }
          $samples | Export-Csv performance-samples.csv -NoTypeInformation
          $samples | Format-Table label,round,mode,startup_visible_rail_ms,process_cpu_ms,one_core_cpu_percent,working_set_bytes,private_bytes -AutoSize | Out-String -Width 220 | Set-Content performance-summary.txt
          Get-Content performance-summary.txt
          'PASS disconnected sample complete; original PID visible rail, hidden state and graceful quit verified; no VPN adapter' | Add-Content performance-summary.txt
      - name: Upload raw measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-evidence
          path: |
            performance-*.json
            performance-*.csv
            performance-*.txt
            performance-*.png
