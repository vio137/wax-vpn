name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stable_version:
        description: 'Prepared stable SemVer, disabled until release + signing gates approved. Leave empty for preview.'
        required: false
        default: ''
        type: string
      unsigned_stable:
        description: 'Explicitly allow stable without certificate, per maintainer decision'
        required: false
        default: false
        type: boolean
  schedule:
    # Hourly checkpoint builds; skipped automatically when nothing changed.
    - cron: "23 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: wax-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      publish: ${{ steps.pub.outputs.publish }}
      skip: ${{ steps.staleness.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Skip hourly build when nothing changed
        if: github.event_name == 'schedule'
        id: staleness
        shell: pwsh
        run: |
          $rel = gh release list --limit 20 --json tagName,isPrerelease | ConvertFrom-Json | Where-Object { -not $_.isDraft } | Select-Object -First 1
          $releasedSha = if ($rel) { gh api "repos/${{ github.repository }}/commits/$($rel.tagName)" --jq .sha } else { "" }
          if ($rel -and $releasedSha -eq "${{ github.sha }}") {
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "HEAD already released as $($rel.tagName); skipping"
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve one version for binary, installer and release
        if: steps.staleness.outputs.skip != 'true'
        shell: pwsh
        env:
          STABLE_VERSION: ${{ inputs.stable_version }}
          SIGNPATH_ENABLED: ${{ vars.WAX_SIGNPATH_ENABLED }}
          UNSIGNED_STABLE: ${{ inputs.unsigned_stable }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:STABLE_VERSION) {
            if ($env:STABLE_VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid stable SemVer' }
            if ($env:STABLE_VERSION -ne $base) { throw 'Stable version must equal workspace package version' }
            if ($env:SIGNPATH_ENABLED -ne 'true' -and $env:UNSIGNED_STABLE -ne 'true') { throw 'Stable requires signing or explicit unsigned_stable selection' }
            $version = $env:STABLE_VERSION
          } else { $version = "$base-preview.${{ github.run_number }}" }
          "WAX_RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append

      - name: Download official WireGuardNT (wireguard.dll)
        if: steps.staleness.outputs.skip != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip" -OutFile wgnt.zip
          Expand-Archive wgnt.zip -DestinationPath vendor\wireguard-nt -Force
          Get-ChildItem -Recurse vendor\wireguard-nt | Format-Table FullName

      - name: Test (workspace)
        if: steps.staleness.outputs.skip != 'true'
        run: cargo test --workspace

      - name: Build release binaries
        if: steps.staleness.outputs.skip != 'true'
        run: cargo build --release --workspace

      - name: Assemble installer payload
        if: steps.staleness.outputs.skip != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer\payload | Out-Null
          Copy-Item "target\release\wax-vpn.exe" "installer\payload\waX VPN.exe"
          Copy-Item "target\release\wax.exe" "installer\payload\wax.exe"
          Copy-Item "vendor\wireguard-nt\wireguard-nt\bin\amd64\wireguard.dll" "installer\payload\wireguard.dll"
          Copy-Item "LICENSE" "installer\payload\LICENSE.txt"
          Copy-Item "docs/vendor-licenses/astryx-MIT.txt" "installer\payload\LICENSE-astryx.txt"
          Copy-Item "assets\icon.ico" "installer\payload\wax.ico"
          Copy-Item "assets\installer-wizard.bmp" "installer\payload\installer-wizard.bmp"
          Copy-Item "assets\installer-header.bmp" "installer\payload\installer-header.bmp"
          Copy-Item "README.md" "installer\payload\README.txt"
          $wgLicense = Get-ChildItem -Recurse vendor\wireguard-nt -Filter "LICENSE*" | Select-Object -First 1
          if ($wgLicense) { Copy-Item $wgLicense.FullName "installer\payload\LICENSE-wireguard-nt.txt" } else { "WireGuardNT prebuilt binaries: see https://git.zx2c4.com/wireguard-nt/about/ (permissive license inside official zip)" | Out-File -Encoding utf8 "installer\payload\LICENSE-wireguard-nt.txt" }

      - name: Install NSIS if needed
        if: steps.staleness.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }

      - name: Build installer
        if: steps.staleness.outputs.skip != 'true'
        shell: pwsh
        run: |
          $version = $env:WAX_RELEASE_VERSION
          $tag = "v$version"
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) { $nsis = @("C:\Program Files (x86)\NSIS\makensis.exe","C:\Program Files\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $nsis) { throw "makensis not found" }
          & $nsis /DWAX_VERSION="$version" installer\wax.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }
          Move-Item "installer\waX-VPN-Setup-$version-x64.exe" "waX-VPN-Setup-$tag-x64.exe" -Force
          Get-FileHash -Algorithm SHA256 "waX-VPN-Setup-$tag-x64.exe" | ForEach-Object { "$($_.Hash.ToLower())  waX-VPN-Setup-$tag-x64.exe" } | Out-File -Encoding ascii "SHA256SUMS-$tag.txt"

      - name: Upload raw binaries
        if: steps.staleness.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wax-vpn-binaries
          path: |
            target\release\wax.exe
            target\release\wax-vpn.exe
            installer\payload\wireguard.dll

      - name: Upload installer artifact
        if: steps.staleness.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wax-vpn-installer
          path: |
            waX-VPN-Setup-*.exe
            SHA256SUMS-*.txt

      - name: Decide publication
        id: pub
        if: steps.staleness.outputs.skip != 'true'
        shell: pwsh
        run: |
          $manual = "${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.stable_version }}" -ne ""
          $changed = git diff --name-only HEAD~1 HEAD
          $codeChanged = ($changed | Where-Object { $_ -notmatch '^(\.github/|README|RELEASE_NOTES)' }).Count -gt 0
          if ($manual) { "publish=true" | Out-File $env:GITHUB_OUTPUT -Append } else { "publish=false" | Out-File $env:GITHUB_OUTPUT -Append }
          Write-Host "manual=$manual codeChanged=$codeChanged changed: $($changed -join ', ')"


  verify:
    name: verify (demo tunnel + GUI)
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wax-vpn-binaries
          path: dl

      - name: Stage binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory bin -Force | Out-Null
          Copy-Item dl\target\release\wax.exe bin\
          Copy-Item dl\target\release\wax-vpn.exe bin\
          Copy-Item dl\installer\payload\wireguard.dll bin\

      - name: Real tunnel test against the official WireGuard demo server
        env:
          WAX_FULL_VERIFY: ${{ github.event_name != 'push' && '1' || '0' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $results = @()
          function Note($m) { Write-Host $m; $script:results += $m }

          # 1. Register a fresh key with demo.wireguard.com (protocol from
          #    wireguard-tools contrib/ncat-client-server)
          $keyout = .\bin\wax.exe keygen
          $priv = ($keyout | Select-String 'PrivateKey = (.+)$').Matches[0].Groups[1].Value.Trim()
          $pub  = ($keyout | Select-String 'PublicKey\s+= (.+)$').Matches[0].Groups[1].Value.Trim()
          $tcp = New-Object System.Net.Sockets.TcpClient
          $tcp.Connect('demo.wireguard.com', 42912)
          $sw = New-Object System.IO.StreamWriter($tcp.GetStream())
          $sw.NewLine = "`n"
          $sw.WriteLine($pub); $sw.Flush()
          Note "sent pubkey: [$pub]"
          $sr = New-Object System.IO.StreamReader($tcp.GetStream())
          $line = $sr.ReadLine()
          $tcp.Close()
          $parts = $line -split ':'
          if ($parts[0] -ne 'OK') { Note "FAIL demo registration: $line"; exit 1 }
          $serverPub = $parts[1]; $serverPort = $parts[2]; $internalIp = $parts[3]
          Note "PASS demo registration (assigned $internalIp)"

          $conf = @(
            '[Interface]',
            "PrivateKey = $priv",
            "Address = $internalIp/24",
            'DNS = 1.1.1.1, 1.0.0.1',
            'MTU = 1380',
            '',
            '[Peer]',
            "PublicKey = $serverPub",
            "Endpoint = demo.wireguard.com:$serverPort",
            'AllowedIPs = 0.0.0.0/0',
            'PersistentKeepalive = 25'
          )
          $conf | Out-File -Encoding ascii demo.conf

          .\bin\wax.exe import demo.conf --name demo
          if ($LASTEXITCODE -ne 0) { Note 'FAIL import'; exit 1 }
          Note 'PASS profile import'

          # 2. Connect (runner is elevated). The tunnel lives only while the
          #    owning process is alive, so keep it running in the background.
          $proc = Start-Process -FilePath "$PWD\bin\wax.exe" -ArgumentList 'connect','demo' -PassThru -WindowStyle Hidden -RedirectStandardOutput connect-out.txt -RedirectStandardError connect-err.txt
          Start-Sleep -Seconds 4
          if ($proc.HasExited) { Note "FAIL connect process exited early: $(Get-Content connect-out.txt,connect-err.txt -Raw)"; exit 1 }
          Note "PASS connect process running (pid $($proc.Id))"

          # 3. Wait for a real handshake
          $handshake = $false
          for ($i = 0; $i -lt 18; $i++) {
            Start-Sleep -Seconds 5
            $status = .\bin\wax.exe status
            if ($status -match 'Last handshake') { $handshake = $true; break }
          }
          if ($handshake) { Note "PASS live handshake: $($status -join ' | ')" } else { Note 'FAIL no handshake within 90s' }

          # 3b. Through-tunnel traffic proof: ping the demo server's tunnel-side address
          if ($handshake) {
            $ping = ping -n 2 -w 3000 192.168.4.1
            if ($LASTEXITCODE -eq 0) { Note 'PASS packets traverse the tunnel (ping 192.168.4.1)' } else { Note 'FAIL no traffic through tunnel (ping 192.168.4.1)' }
          }

          # 4. Adapter + DNS state
          $adapter = Get-NetAdapter -Name 'waX VPN' -ErrorAction SilentlyContinue
          if ($adapter -and $adapter.Status -eq 'Up') { Note 'PASS adapter up' } else { Note 'FAIL adapter not up' }
          $dns = Get-DnsClientServerAddress -InterfaceAlias 'waX VPN' -AddressFamily IPv4 -ErrorAction SilentlyContinue
          if ($dns.ServerAddresses -contains '1.1.1.1') { Note 'PASS tunnel DNS applied' } else { Note 'FAIL tunnel DNS missing' }

          $tunnelIp = Get-NetIPInterface -InterfaceAlias 'waX VPN' -AddressFamily IPv4 -ErrorAction SilentlyContinue
          if ($tunnelIp.NlMtu -eq 1380) { Note 'PASS configured tunnel IPv4 MTU applied (1380 bytes)' } else { Note "FAIL tunnel MTU mismatch: $($tunnelIp.NlMtu)" }

          .\bin\wax.exe diagnostics | Out-File diagnostics.json -Encoding utf8
          $diagnostics = Get-Content diagnostics.json -Raw | ConvertFrom-Json
          if ($diagnostics.tunnel_status -eq 'adapter_up' -and $diagnostics.internet_reachability -eq 'not_tested' -and $diagnostics.schema_version -eq 1) { Note 'PASS allowlisted diagnostics reports adapter state without internet claim' } else { Note 'FAIL diagnostics schema/state mismatch' }

          # Launch GUI while CLI owns the adapter. Startup monitoring must
          # refresh stats and notice that externally owned tunnel stopping.
          $observer = Start-Process -FilePath "$PWD\bin\wax-vpn.exe" -PassThru
          Start-Sleep -Seconds 5

          # 5. Disconnect and verify restoration
          .\bin\wax.exe disconnect
          if ($LASTEXITCODE -ne 0) { Note 'FAIL disconnect command'; if (-not $proc.HasExited) { $proc.Kill() }; exit 1 }
          Start-Sleep -Seconds 2
          if (-not $proc.HasExited) { $proc.Kill() }
          Start-Sleep -Seconds 3
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $desktop = [System.Windows.Automation.AutomationElement]::RootElement
          $observerWindow = $desktop.FindFirst([System.Windows.Automation.TreeScope]::Children, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $observer.Id)))
          $disconnected = if ($observerWindow) { $observerWindow.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Disconnected'))) } else { $null }
          if ($disconnected) { Note 'PASS startup observer detects externally owned tunnel stopping without reconnect' } else { Note 'FAIL startup observer still stale or window missing' }
          $quitObserver = Start-Process -FilePath "$PWD\bin\wax-vpn.exe" -ArgumentList '--quit' -PassThru
          $quitObserver.WaitForExit(10000) | Out-Null
          if (-not $observer.WaitForExit(10000)) { Note 'FAIL observer did not quit'; $observer.Kill() }
          $dnsAfter = Get-DnsClientServerAddress -InterfaceAlias 'waX VPN' -AddressFamily IPv4 -ErrorAction SilentlyContinue
          if (-not $dnsAfter -or $dnsAfter.ServerAddresses.Count -eq 0) { Note 'PASS DNS restored on disconnect' } else { Note "FAIL DNS left behind: $($dnsAfter.ServerAddresses -join ',')" }
          $leftRules = Get-NetFirewallRule -DisplayName 'waX VPN KillSwitch*' -ErrorAction SilentlyContinue
          if (-not $leftRules) { Note 'PASS no firewall leftovers' } else { Note 'FAIL firewall leftovers' }

          if ($env:WAX_FULL_VERIFY -eq '1') {
          # 6. Crash leg: kill the tunnel owner mid-connection, then check for residue
          $proc2 = Start-Process -FilePath "$PWD\bin\wax.exe" -ArgumentList 'connect','demo' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 12
          if ($proc2.HasExited) { Note 'WARN crash-leg connect exited early' } else {
            $proc2.Kill()
            Start-Sleep -Seconds 3
            $dnsCrash = Get-DnsClientServerAddress -InterfaceAlias 'waX VPN' -AddressFamily IPv4 -ErrorAction SilentlyContinue
            $adapterCrash = Get-NetAdapter -Name 'waX VPN' -ErrorAction SilentlyContinue
            $rulesPre = Get-NetFirewallRule -DisplayName 'waX VPN KillSwitch*' -ErrorAction SilentlyContinue
            Note ("INFO state 3s after owner kill (before any cleanup): adapter=" + $(if ($adapterCrash) { 'present' } else { 'gone' }) + " dns=" + $(if ($dnsCrash) { ($dnsCrash.ServerAddresses -join ',') } else { 'none' }) + " killSwitchRules=" + $(if ($rulesPre) { $rulesPre.Count } else { 0 }))
            .\bin\wax.exe disconnect | Out-Null
            Start-Sleep -Seconds 2
            $dnsCrashAfter = Get-DnsClientServerAddress -InterfaceAlias 'waX VPN' -AddressFamily IPv4 -ErrorAction SilentlyContinue
            if (-not $dnsCrashAfter -or $dnsCrashAfter.ServerAddresses.Count -eq 0) { Note 'PASS DNS clean after simulated crash + cleanup' } else { Note "FAIL DNS residue after crash: $($dnsCrashAfter.ServerAddresses -join ',')" }
            $rulesCrash = Get-NetFirewallRule -DisplayName 'waX VPN KillSwitch*' -ErrorAction SilentlyContinue
            if (-not $rulesCrash) { Note 'PASS no firewall rules after crash cleanup' } else { Note 'FAIL firewall rules left after crash' }
          }

          # Unsupported protection must fail before changing network state.
          $reject = & .\bin\wax.exe connect demo --kill-switch 2>&1
          if ($LASTEXITCODE -ne 0 -and "$reject" -match 'unexpected argument') {
            Note 'PASS removed CLI flag rejected by argument parser'
          } else { Note 'FAIL removed CLI flag was not rejected' }
          $v6 = [Net.Sockets.TcpClient]::new([Net.Sockets.AddressFamily]::InterNetworkV6)
          try {
            $t = $v6.ConnectAsync([Net.IPAddress]::Parse('2606:4700:4700::1111'),443)
            $reachable = $t.Wait(2500) -and $v6.Connected
            if ($reachable) { Note 'INFO IPv6 baseline reachable; no kill switch so IPv6 leak protection is NOT offered' }
            else { Note 'SKIP IPv6 leak protection test: no proven IPv6 baseline and no kill switch' }
          } catch { Note 'SKIP IPv6 leak protection test: no proven IPv6 baseline and no kill switch' } finally { $v6.Dispose() }
          } else {
            Note 'INFO extended crash/IPv6 legs skipped on push builds (hourly schedule and manual dispatch run them)'
          }

          $results | Out-File -Encoding utf8 verify-results.txt
          if ($results -match '^FAIL') { exit 1 }
          # The removed-option negative test deliberately returns nonzero.
          # Do not let Actions propagate that expected native exit code.
          exit 0

      - name: GUI screenshot (app window only)
        if: always()
        shell: powershell
        run: |
          Write-Host "UIA harness: PowerShell $($PSVersionTable.PSVersion) CLR $($PSVersionTable.CLRVersion)"
          $p = Start-Process -FilePath "$PWD\bin\wax-vpn.exe" -PassThru
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type -ReferencedAssemblies System.Drawing.Primitives -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public class WaxWin32 {
            [DllImport("user32.dll", SetLastError=true)] public static extern IntPtr FindWindowW(string lpClassName, string lpWindowName);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT lpRect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            public static void SendCtrlDigit(int d) {
              const byte VK_CONTROL = 0x11; const uint KEYUP = 0x0002;
              keybd_event(VK_CONTROL, 0, 0, UIntPtr.Zero);
              keybd_event((byte)(0x30 + d), 0, 0, UIntPtr.Zero);
              keybd_event((byte)(0x30 + d), 0, KEYUP, UIntPtr.Zero);
              keybd_event(VK_CONTROL, 0, KEYUP, UIntPtr.Zero);
            }
          }
          "@
          $hwnd = [IntPtr]::Zero
          for ($i = 0; $i -lt 25 -and $hwnd -eq [IntPtr]::Zero; $i++) {
            Start-Sleep -Seconds 2
            $hwnd = [WaxWin32]::FindWindowW($null, 'waX VPN')
            if ($hwnd -eq [IntPtr]::Zero) { $p.Refresh(); $hwnd = $p.MainWindowHandle }
          }
          Write-Host "window handle: $hwnd (process exited: $($p.HasExited))"
          if ($hwnd -ne [IntPtr]::Zero) {
            [WaxWin32]::SetForegroundWindow($hwnd) | Out-Null
            Start-Sleep -Seconds 2
            $r = New-Object WaxWin32+RECT
            [WaxWin32]::GetWindowRect($hwnd, [ref]$r) | Out-Null
            $w = $r.Right - $r.Left; $h = $r.Bottom - $r.Top
            Write-Host "window rect: $($r.Left),$($r.Top) ${w}x${h}"
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.Left, $r.Top, 0, 0, (New-Object System.Drawing.Size $w, $h))
            $bmp.Save('gui-screenshot.png')
            $g.Dispose(); $bmp.Dispose()
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            $uiaWin = [System.Windows.Automation.AutomationElement]::FromHandle($hwnd)
            $allBtns = $uiaWin.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)))
            Write-Host "buttons in tree: $(@($allBtns | ForEach-Object { $_.Current.Name }) -join ' | ')"
            $marker = @{ Profiles='Profiles'; Features='Features'; WARP='Cloudflare WARP'; About='About' }
            foreach ($tab in @('Profiles','Features','WARP','About')) {
              $nb = $uiaWin.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.AndCondition((New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $tab)), (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)))))
              if (-not $nb) { Write-Error "UIA: no rail button named '$tab' in the app window"; exit 1 }
              $nb.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Start-Sleep -Milliseconds 1500
              $mk = $uiaWin.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.AndCondition((New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $marker[$tab])), (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Text)))))
              if (-not $mk) {
                $allText = $uiaWin.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Text)))
                Write-Host "text elements present: $(@($allText | ForEach-Object { $_.Current.Name }) -join ' | ')"
                Write-Error "UIA: heading '$($marker[$tab])' not visible after invoking '$tab' - tab did not switch"
                exit 1
              }
              $bmp2 = New-Object System.Drawing.Bitmap $w, $h
              $g2 = [System.Drawing.Graphics]::FromImage($bmp2)
              $g2.CopyFromScreen($r.Left, $r.Top, 0, 0, (New-Object System.Drawing.Size $w, $h))
              $bmp2.Save("gui-screenshot-$($tab.ToLower()).png")
              $g2.Dispose(); $bmp2.Dispose()
              if ($tab -eq 'About') {
                $generate = $uiaWin.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Generate local report')))
                if (-not $generate) { throw 'Local diagnostics button missing' }
                $generate.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
                Start-Sleep -Seconds 3
                $copy = $uiaWin.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Copy report')))
                if (-not $copy) { throw 'Local diagnostics report did not finish' }
                $diagImage = New-Object System.Drawing.Bitmap $w, $h
                $diagGraphics = [System.Drawing.Graphics]::FromImage($diagImage)
                $diagGraphics.CopyFromScreen($r.Left, $r.Top, 0, 0, (New-Object System.Drawing.Size $w, $h))
                $diagImage.Save('gui-screenshot-diagnostics.png')
                $diagGraphics.Dispose(); $diagImage.Dispose()
                $clear = $uiaWin.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Clear')))
                if (-not $clear) { throw 'Local diagnostics clear button missing' }
                $clear.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
                Start-Sleep -Milliseconds 500
                $copy = $uiaWin.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Copy report')))
                if ($copy) { throw 'Local diagnostics clear did not remove report' }
                'local-diagnostics-generate-clear=PASS' | Out-File -FilePath verify-results.txt -Append -Encoding utf8
              }
            }
          } else {
            Write-Host 'window not found, full-screen fallback'
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save('gui-screenshot.png')
            $g.Dispose(); $bmp.Dispose()
          }
          if (-not $p.HasExited) { $p.Kill() }

      - name: GUI interaction (UI-driven connect, popups, close-to-tray)
        if: always()
        env:
          WAX_FULL_VERIFY: ${{ github.event_name != 'push' && '1' || '0' }}
        shell: powershell
        run: |
          Write-Host "UIA harness: PowerShell $($PSVersionTable.PSVersion) CLR $($PSVersionTable.CLRVersion)"
          $ErrorActionPreference = 'Continue'
          function Note($m) { Write-Host $m; $m | Out-File -FilePath verify-results.txt -Append -Encoding utf8 }
          Add-Type -TypeDefinition @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public class WaxCon {
            [DllImport("user32.dll", SetLastError=true)] public static extern IntPtr FindWindowW(string lpClassName, string lpWindowName);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr l);
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern int GetClassNameW(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, IntPtr e);
            [DllImport("user32.dll")] public static extern int GetWindowTextW(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            public static bool AnyWindowVisibleOfPid(uint target) {
              bool found = false;
              EnumWindows((h,l) => {
                uint pid; GetWindowThreadProcessId(h, out pid);
                if (pid == target && IsWindowVisible(h)) found = true;
                return true;
              }, IntPtr.Zero);
              return found;
            }
            public static string ListWindows() {
              var lines = new System.Collections.Generic.List<string>();
              EnumWindows((h,l) => {
                var t = new StringBuilder(128); GetWindowTextW(h, t, 128);
                var c = new StringBuilder(128); GetClassNameW(h, c, 128);
                uint pid; GetWindowThreadProcessId(h, out pid);
                if (t.Length > 0 || IsWindowVisible(h)) lines.Add(string.Format("hwnd={0} pid={1} vis={2} title='{3}' class='{4}'", h, pid, IsWindowVisible(h), t, c));
                return true;
              }, IntPtr.Zero);
              return string.Join("\n", lines);
            }
            public static int CountConsoles() {
              int c = 0;
              EnumWindows((h,l) => { var sb = new StringBuilder(256); GetClassNameW(h, sb, 256); if (sb.ToString() == "ConsoleWindowClass" && IsWindowVisible(h)) c++; return true; }, IntPtr.Zero);
              return c;
            }
            public static void RightClick(int x, int y) {
              SetCursorPos(x, y);
              mouse_event(0x0008, 0, 0, 0, IntPtr.Zero);
              mouse_event(0x0010, 0, 0, 0, IntPtr.Zero);
            }
          }
          "@
          Get-Process wax-vpn -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Remove-Item (Join-Path $env:APPDATA 'wax-vpn\wax-debug.log') -ErrorAction SilentlyContinue
          $conBefore = [WaxCon]::CountConsoles()
          # Scoped split-tunnel check: exclude 8.8.8.8/32 for the demo profile
          # (runner-local settings only; no live routes touched beyond the demo tunnel).
          $cfgDir = Join-Path $env:APPDATA 'wax-vpn'
          New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
          Set-Content -Path (Join-Path $cfgDir 'settings.json') -Value '{"split_exclusions":{"demo":"8.8.8.8/32"}}'
          $pg = Start-Process -FilePath "$PWD\bin\wax-vpn.exe" -PassThru
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $ac = 'System.Windows.Automation'
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $win = $null
          for ($i = 0; $i -lt 30 -and -not $win; $i++) {
            Start-Sleep -Seconds 2
            $win = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'waX VPN')))
          }
          if (-not $win) {
            Note 'FAIL GUI window not found for interaction test'
          } else {
            $btn = $null
            for ($i = 0; $i -lt 20 -and -not $btn; $i++) {
              Start-Sleep -Seconds 2
              $ct = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)
              # The rail also has a 'Connect' button; the action button is named for its profile.
              $nm1 = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Connect to demo')
              $nm2 = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Disconnect from demo')
              $nm = New-Object System.Windows.Automation.OrCondition($nm1, $nm2)
              $btn = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.AndCondition($ct, $nm)))
            }
            if (-not $btn) {
              Note 'FAIL Connect button not found through UI Automation'
            } else {
              # Watch console windows continuously while connecting: a
              # before/after count alone would miss a transient flash.
              Add-Type -TypeDefinition @"
              using System;
              using System.Threading;
              using System.Text;
              using System.Runtime.InteropServices;
              public static class WaxConsoleSampler {
                [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc cb, IntPtr l);
                delegate bool EnumProc(IntPtr h, IntPtr l);
                [DllImport("user32.dll")] static extern int GetClassNameW(IntPtr h, StringBuilder s, int n);
                [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
                static volatile bool stop;
                static Thread thread;
                public static int Peak;
                public static int Samples;
                public static string Error;
                public static void Start() {
                  stop = false; Peak = 0; Samples = 0; Error = null;
                  thread = new Thread(() => {
                    try {
                      while (!stop) {
                        int count = 0;
                        EnumWindows((h,l) => { var s = new StringBuilder(256); GetClassNameW(h,s,256); if (s.ToString() == "ConsoleWindowClass" && IsWindowVisible(h)) count++; return true; }, IntPtr.Zero);
                        if (count > Peak) Peak = count;
                        Samples++;
                        Thread.Sleep(100);
                      }
                    } catch (Exception e) { Error = e.GetType().Name; }
                  });
                  thread.IsBackground = true;
                  thread.Start();
                }
                public static bool Stop() { stop = true; return thread.Join(2000); }
              }
          "@
              [WaxConsoleSampler]::Start()
              # Ensure the sampler ran before triggering connection.
              for ($i=0; $i -lt 20 -and [WaxConsoleSampler]::Samples -eq 0; $i++) { Start-Sleep -Milliseconds 20 }
              Add-Type -TypeDefinition @"
              using System;
              using System.Runtime.InteropServices;
              public static class WaxLayoutCapture {
                [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int w, int ht, bool repaint);
              }
          "@
              function Capture-StateSizes([string]$stateName) {
                foreach ($size in @(@(760,540),@(880,600),@(960,700))) {
                  [WaxLayoutCapture]::MoveWindow([IntPtr]$win.Current.NativeWindowHandle,0,0,$size[0],$size[1],$true) | Out-Null
                  # Let the compositor paint after resize before comparing pixels and UIA.
                  Start-Sleep -Milliseconds 500
                  $bounds = $win.Current.BoundingRectangle
                  $image = New-Object System.Drawing.Bitmap ([int]$bounds.Width),([int]$bounds.Height)
                  $graphics = [System.Drawing.Graphics]::FromImage($image)
                  $graphics.CopyFromScreen([int]$bounds.X,[int]$bounds.Y,0,0,$image.Size)
                  $image.Save("layout-$stateName-$($size[0])x$($size[1]).png")
                  $textCondition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Text)
                  $stateTexts = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, $textCondition)
                  "$stateName $($size[0])x$($size[1]): $(@($stateTexts | ForEach-Object { $_.Current.Name }) -join ' | ')" | Out-File layout-state-evidence.txt -Append
                  $anchors = $stateTexts | Where-Object { $_.Current.Name -in @('Session','Received','Sent') }
                  $anchors | ForEach-Object { "$stateName $($size[0])x$($size[1]) anchor=$($_.Current.Name) bounds=$($_.Current.BoundingRectangle)" | Out-File layout-state-evidence.txt -Append }
                  $graphics.Dispose(); $image.Dispose()
                }
                [WaxLayoutCapture]::MoveWindow([IntPtr]$win.Current.NativeWindowHandle,0,0,880,600,$true) | Out-Null
              }
              Capture-StateSizes 'disconnected'
              $btn.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Start-Sleep -Milliseconds 100
              Capture-StateSizes 'connecting'
              Note 'INFO GUI stage: Connecting captures complete; waiting before CLI status read'
              $up = $false
              for ($i = 0; $i -lt 24 -and -not $up; $i++) {
                Start-Sleep -Seconds 5
                Note 'INFO GUI stage: CLI status read starting'
                $st = .\bin\wax.exe status
                Note 'INFO GUI stage: CLI status read returned'
                if ($st -match 'Last handshake') { $up = $true }
              }
              if ($up) { Note 'PASS GUI-driven connect: handshake after clicking Connect in the app' } else { Note 'FAIL GUI-driven connect: no handshake within 120s of clicking Connect' }
              if ($up) {
                Capture-StateSizes 'connected'
                Start-Sleep -Seconds 2
                Add-Type -AssemblyName System.Drawing
                $windowBounds = $win.Current.BoundingRectangle
                $connectedImage = New-Object System.Drawing.Bitmap ([int]$windowBounds.Width),([int]$windowBounds.Height)
                $connectedGraphics = [System.Drawing.Graphics]::FromImage($connectedImage)
                $connectedGraphics.CopyFromScreen([int]$windowBounds.X,[int]$windowBounds.Y,0,0,$connectedImage.Size)
                $connectedImage.Save('gui-screenshot-connected.png')
                $connectedGraphics.Dispose(); $connectedImage.Dispose()
                function Test-IPv4InPrefix([string]$prefix, [string]$ip) {
                  $parts = $prefix -split '/'
                  $plen = [int]$parts[1]
                  if ($plen -eq 0) { return $true }
                  $b = [System.Net.IPAddress]::Parse($parts[0]).GetAddressBytes()
                  $a = [System.Net.IPAddress]::Parse($ip).GetAddressBytes()
                  $bv = ([uint32]$b[0] -shl 24) -bor ([uint32]$b[1] -shl 16) -bor ([uint32]$b[2] -shl 8) -bor $b[3]
                  $av = ([uint32]$a[0] -shl 24) -bor ([uint32]$a[1] -shl 16) -bor ([uint32]$a[2] -shl 8) -bor $a[3]
                  $m = [uint32](([uint64][uint32]::MaxValue -shl (32 - $plen)) -band [uint32]::MaxValue)
                  return (($av -band $m) -eq ($bv -band $m))
                }
                $wr = @(Get-NetRoute -InterfaceAlias 'waX VPN' -AddressFamily IPv4 -ErrorAction SilentlyContinue)
                $covered = @($wr | Where-Object { Test-IPv4InPrefix $_.DestinationPrefix '8.8.8.8' })
                $kept = @($wr | Where-Object { Test-IPv4InPrefix $_.DestinationPrefix '1.1.1.1' })
                $offTunnel = @(Get-NetRoute -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object { $_.InterfaceAlias -ne 'waX VPN' -and (Test-IPv4InPrefix $_.DestinationPrefix '8.8.8.8') })
                if ($wr.Count -gt 10 -and $covered.Count -eq 0 -and $kept.Count -gt 0 -and $offTunnel.Count -gt 0) {
                  Note "PASS split tunneling: $($wr.Count) tunnel routes, none covers 8.8.8.8; 1.1.1.1 still tunnel-routed; 8.8.8.8 resolves via $($offTunnel[0].InterfaceAlias)"
                } else {
                  Note "FAIL split tunneling: routes=$($wr.Count) covers-excluded=$($covered.Count) keeps-1.1.1.1=$($kept.Count) off-tunnel=$($offTunnel.Count)"
                }
              }
              if ($up) {
                # Targeted adapter-loss recovery, not physical-network roaming.
                .\bin\wax.exe disconnect | Out-Null
                $recoveryWatch = [System.Diagnostics.Stopwatch]::StartNew()
                $recovered = $false
                for ($i=0; $i -lt 20 -and -not $recovered; $i++) {
                  Start-Sleep -Seconds 1
                  $recoveryStatus = .\bin\wax.exe status
                  if ($recoveryStatus -match 'Last handshake') { $recovered = $true }
                }
                if ($recovered -and $recoveryWatch.Elapsed.TotalSeconds -ge 2 -and -not $pg.HasExited) {
                  Note "PASS GUI owned adapter-loss recovery: handshake after bounded delay ($([int]$recoveryWatch.Elapsed.TotalSeconds)s), original process alive"
                } else {
                  Note 'FAIL GUI owned adapter-loss recovery did not restore a handshake after a bounded delay'
                }
              }
              if ($up -and $env:WAX_FULL_VERIFY -eq '1') {
                # Exercise the real setting during an observed automatic retry.
                # No delay hooks or fabricated app state. This proves cancellation
                # after an observed pending retry, not a deterministic in-flight race.
                function Find-WaxControl([string]$name, $kind) {
                  $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
                    (New-Object System.Windows.Automation.AndCondition(
                      (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)),
                      (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, $kind)))))
                }
                function Has-WaxAdapter {
                  @([System.Net.NetworkInformation.NetworkInterface]::GetAllNetworkInterfaces() | Where-Object { $_.Name -eq 'waX VPN' }).Count -gt 0
                }
                try {
                  .\bin\wax.exe disconnect | Out-Null
                  $pending = $null
                  for ($i=0; $i -lt 200 -and -not $pending; $i++) {
                    $pending = Find-WaxControl 'Cancel retry' ([System.Windows.Automation.ControlType]::Button)
                    if (-not $pending) { Start-Sleep -Milliseconds 50 }
                  }
                  if (-not $pending) { throw 'No real pending retry observed' }
                  Note 'INFO observed real Cancel retry action before disabling Auto-reconnect'
                  Note 'INFO GUI recovery-disable stage: locating Features'
                  $features = Find-WaxControl 'Features' ([System.Windows.Automation.ControlType]::Button)
                  Note 'INFO GUI recovery-disable stage: invoking Features'
                  $features.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
                  Note 'INFO GUI recovery-disable stage: locating Auto-reconnect'
                  $auto = $null
                  for ($i=0; $i -lt 20 -and -not $auto; $i++) {
                    $auto = Find-WaxControl 'Auto-reconnect' ([System.Windows.Automation.ControlType]::CheckBox)
                    if (-not $auto) { Start-Sleep -Milliseconds 50 }
                  }
                  if (-not $auto) { throw 'Auto-reconnect checkbox missing' }
                  $toggle = $auto.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern)
                  if ($toggle.Current.ToggleState -ne [System.Windows.Automation.ToggleState]::On) { throw 'Auto-reconnect was not enabled' }
                  Note 'INFO GUI recovery-disable stage: invoking toggle'
                  $toggle.Toggle()
                  Note 'INFO GUI recovery-disable stage: toggle returned'
                  Start-Sleep -Milliseconds 250
                  $saved = Get-Content (Join-Path $cfgDir 'settings.json') -Raw | ConvertFrom-Json
                  if ($saved.auto_reconnect -ne $false) { throw 'Disabled setting not saved' }
                  $connectRail = Find-WaxControl 'Connect' ([System.Windows.Automation.ControlType]::Button)
                  $connectRail.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
                  $ready = $null
                  for ($i=0; $i -lt 150 -and -not $ready; $i++) {
                    $ready = Find-WaxControl 'Connect to demo' ([System.Windows.Automation.ControlType]::Button)
                    if ($ready -and (Has-WaxAdapter)) { $ready = $null }
                    if (-not $ready) { Start-Sleep -Milliseconds 100 }
                  }
                  if (-not $ready) { throw 'Cancellation did not return to disconnected without adapter' }
                  $revived = $false
                  for ($i=0; $i -lt 48; $i++) {
                    if (Has-WaxAdapter) { $revived = $true }
                    Start-Sleep -Milliseconds 250
                  }
                  $pg.Refresh()
                  if ($revived -or $pg.HasExited) { throw 'Adapter reappeared during cancellation samples or original process exited' }
                  Note 'PASS recovery-disable after observed pending retry: setting saved, disconnected, adapter absent in 48 samples over 12s, original process alive'
                  $bounds = $win.Current.BoundingRectangle
                  $im = New-Object System.Drawing.Bitmap ([int]$bounds.Width),([int]$bounds.Height)
                  $gr = [System.Drawing.Graphics]::FromImage($im)
                  $gr.CopyFromScreen([int]$bounds.X,[int]$bounds.Y,0,0,$im.Size)
                  $im.Save('gui-screenshot-recovery-cancelled.png'); $gr.Dispose(); $im.Dispose()
                  # Disabled automation must not disable an explicit user Connect.
                  $ready.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
                  $manualUp = $false
                  for ($i=0; $i -lt 20 -and -not $manualUp; $i++) {
                    Start-Sleep -Seconds 1
                    $manualUp = (.\bin\wax.exe status) -match 'Last handshake'
                  }
                  if (-not $manualUp) { throw 'Manual reconnect failed while automatic recovery disabled' }
                  Note 'PASS explicit manual reconnect while Auto-reconnect disabled: fresh peer handshake'
                  $features = Find-WaxControl 'Features' ([System.Windows.Automation.ControlType]::Button)
                  $features.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
                  Start-Sleep -Milliseconds 250
                  $auto = Find-WaxControl 'Auto-reconnect' ([System.Windows.Automation.ControlType]::CheckBox)
                  $auto.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern).Toggle()
                  $connectRail = Find-WaxControl 'Connect' ([System.Windows.Automation.ControlType]::Button)
                  $connectRail.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
                } catch {
                  Note "FAIL targeted recovery-disable sequence: $($_.Exception.Message)"
                }
              }
              $conAfter = [WaxCon]::CountConsoles()
              $watcherStopped = [WaxConsoleSampler]::Stop()
              $conMax = [WaxConsoleSampler]::Peak
              $samples = [WaxConsoleSampler]::Samples
              if (-not $watcherStopped -or $samples -lt 2 -or [WaxConsoleSampler]::Error) {
                Note "WARN console sampler incomplete; popup absence not verified (samples=$samples error=$([WaxConsoleSampler]::Error))"
              } elseif (($conMax -le $conBefore) -and ($conAfter -le $conBefore)) {
                Note "PASS no console windows observed during GUI connect ($samples samples at ~100ms; shorter windows could be missed; baseline=$conBefore peak=$conMax end=$conAfter)"
              } else { Note "FAIL console window observed during GUI connect (baseline=$conBefore peak=$conMax end=$conAfter)" }
              $mainHwnd = [IntPtr]$win.Current.NativeWindowHandle
              try {
                $win.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern).Close()
              } catch { Note "WARN window Close pattern failed: $($_.Exception.Message)" }
              Start-Sleep -Seconds 4
              if (-not $pg.HasExited) {
                $ad = Get-NetAdapter -Name 'waX VPN' -ErrorAction SilentlyContinue
                if ($ad) { Note 'PASS close-to-tray: app still running and tunnel adapter still up after closing the window' } else { Note 'WARN close-to-tray: app alive after close but adapter is gone' }
              } else {
                Note 'FAIL close-to-tray: app exited when the window was closed'
              }
              # Single instance: a second launch must signal the running instance
              # (window hidden by close-to-tray must reappear), then exit itself.
              $p2 = Start-Process -FilePath "$PWD\bin\wax-vpn.exe" -PassThru
              # Prove the restored window is the actual main UI: find the UIA
              # window by title and require it on-screen with rail content.
              # (A second same-titled helper window never becomes visible, and a
              # bare PID visibility check could pass on a helper.)
              $siVisible = $false
              for ($i = 0; $i -lt 12 -and -not $siVisible; $i++) {
                Start-Sleep -Seconds 1
                $w2 = [System.Windows.Automation.AutomationElement]::FromHandle($mainHwnd)
                if ($w2) {
                  $rail = $w2.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.AndCondition((New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Connect')), (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)))))
                  $siVisible = ($null -ne $rail) -and ($w2.Current.ProcessId -eq $pg.Id) -and [WaxCon]::IsWindowVisible($mainHwnd) -and (-not $w2.Current.IsOffscreen)
                }
              }
              $p2.Refresh(); $pg.Refresh()
              if (-not $pg.HasExited -and $p2.HasExited -and $siVisible) {
                Note 'PASS single instance: original main HWND visible, owned by original PID, Connect rail present and on-screen; second process exited'
              } else {
                Note "FAIL single instance: first-alive=$(-not $pg.HasExited) second-exited=$($p2.HasExited) window-visible=$siVisible"
                $dbg = Get-Content (Join-Path $env:APPDATA 'wax-vpn\wax-debug.log') -ErrorAction SilentlyContinue
                if ($dbg) { $dbg | ForEach-Object { Note "DIAG $_" } } else { Note 'DIAG no show-path diagnostics recorded (signal never consumed?)' }
                [WaxCon]::ListWindows() -split "\n" | ForEach-Object { Note "DIAGWIN $_" }
                if (-not $p2.HasExited) { $p2.Kill() }
              }
              # The runner session has no notification area (Shell_TrayWnd absent), so
              # tray-menu interaction cannot be automated here; it stays a manual check
              # on real Windows. The graceful-quit path itself (same cleanup as tray
              # Quit) is verified through the app's --quit request.
              Note 'INFO tray menu Quit/Open: manual-only on real Windows (runner has no notification area)'
              .\bin\wax-vpn.exe --quit
              for ($i = 0; $i -lt 15 -and -not $pg.HasExited; $i++) { Start-Sleep -Seconds 1 }
              $pg.Refresh()
              if ($pg.HasExited) {
                $ad2 = Get-NetAdapter -Name 'waX VPN' -ErrorAction SilentlyContinue
                if (-not $ad2) { Note 'PASS graceful quit: app exited on --quit request and adapter removed' } else { Note 'FAIL graceful quit: app exited but adapter remains' }
              } else {
                Note 'FAIL graceful quit: app still running 15s after --quit request'
                $dbg2 = Get-Content (Join-Path $env:APPDATA 'wax-vpn\wax-debug.log') -ErrorAction SilentlyContinue
                if ($dbg2) { $dbg2 | ForEach-Object { Note "DIAG $_" } }
                $pg.Kill()
              }
              .\bin\wax.exe disconnect | Out-Null
            }
          }
          if (Get-Content verify-results.txt -ErrorAction SilentlyContinue | Where-Object { $_ -match '^FAIL' }) { exit 1 }

      - name: Record GUI host failure evidence
        if: failure()
        shell: pwsh
        run: |
          # Runner-local application fault records only, not profiles or account data.
          $ErrorActionPreference = 'Continue'
          $start = (Get-Date).AddMinutes(-15)
          $events = Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$start; Id=1000,1001,1026} -ErrorAction SilentlyContinue
          $events | Where-Object { $_.Message -match '(?i)pwsh|powershell|wax-vpn|wax\.exe' } | ForEach-Object {
            "TIME=$($_.TimeCreated.ToUniversalTime().ToString('o')) ID=$($_.Id) PROVIDER=$($_.ProviderName)"
            $_.Message
          } | Out-File gui-host-failure.txt -Encoding utf8
          Get-Process pwsh,wax-vpn,wax -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,StartTime,Responding | Format-Table | Out-String | Add-Content gui-host-failure.txt

      - name: Settings failure warning (full-only local check)
        if: always() && github.event_name != 'push'
        shell: powershell
        run: |
          Write-Host "UIA harness: PowerShell $($PSVersionTable.PSVersion) CLR $($PSVersionTable.CLRVersion)"
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class SettingsCapture {
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h,int x,int y,int w,int height,bool repaint);
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
          }
          "@
          $previous = @(Get-Process wax-vpn -ErrorAction SilentlyContinue)
          if ($previous.Count -gt 0) {
            .\bin\wax-vpn.exe --quit
            if ($LASTEXITCODE -ne 0) { throw 'previous GUI quit request failed' }
            foreach ($old in $previous) { if (-not $old.WaitForExit(15000)) { throw 'previous GUI cleanup timed out' } }
          }
          if (Get-NetAdapter -Name 'waX VPN' -ErrorAction SilentlyContinue) {
            .\bin\wax.exe disconnect | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'settings fixture tunnel cleanup failed' }
          }
          $global:LASTEXITCODE = 0
          $path = Join-Path $env:APPDATA 'wax-vpn\settings.json'
          $had = Test-Path $path
          $before = if ($had) { [IO.File]::ReadAllBytes($path) } else { $null }
          $bad = [Text.Encoding]::UTF8.GetBytes('{broken-settings-fixture')
          $process = $null
          $profileDir = Join-Path $env:APPDATA 'wax-vpn\profiles'
          $fixtureId = [Guid]::NewGuid().ToString('N')
          $badProfile = Join-Path $profileDir "$fixtureId.conf"
          $profileBackup = "$profileDir-$fixtureId-backup"
          $profileMoved = $false
          function Find-SettingsControl([string]$name, $type) {
            $condition = New-Object System.Windows.Automation.AndCondition((New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty,$name)),(New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty,$type)))
            $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$condition)
          }
          function Save-SettingsCapture([string]$name) {
            $rect = New-Object SettingsCapture+RECT
            [SettingsCapture]::GetWindowRect($handle,[ref]$rect) | Out-Null
            $image = New-Object Drawing.Bitmap ($rect.Right-$rect.Left),($rect.Bottom-$rect.Top)
            $graphics = [Drawing.Graphics]::FromImage($image)
            try { $graphics.CopyFromScreen($rect.Left,$rect.Top,0,0,$image.Size); $image.Save($name) }
            finally { $graphics.Dispose(); $image.Dispose() }
          }
          try {
            [IO.Directory]::CreateDirectory((Split-Path $path)) | Out-Null
            [IO.File]::WriteAllBytes($path,$bad)
            [IO.Directory]::CreateDirectory($profileDir) | Out-Null
            [IO.File]::WriteAllText($badProfile,'not-a-wireguard-configuration')
            $process = Start-Process "$PWD\bin\wax-vpn.exe" -PassThru
            $window = $null
            for ($i=0; $i -lt 20 -and -not $window; $i++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.MainWindowHandle -ne 0) { $window = [System.Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle) }
            }
            if (-not $window) { throw 'settings fixture main window missing' }
            $handle = [IntPtr]$window.Current.NativeWindowHandle
            [SettingsCapture]::MoveWindow($handle,0,0,880,600,$true) | Out-Null
            Start-Sleep -Seconds 2
            $loadWarning = 'Saved settings could not be read and were kept unchanged. Auto-reconnect is off for this session. Check your settings file before relying on saved preferences.'
            if (-not (Find-SettingsControl $loadWarning ([System.Windows.Automation.ControlType]::Text))) { throw 'settings load warning missing' }
            Save-SettingsCapture 'gui-settings-load-warning.png'
            $profileWarning = '1 profile file(s) could not be read or parsed and were skipped. Files were not changed.'
            if (-not (Find-SettingsControl $profileWarning ([System.Windows.Automation.ControlType]::Text))) { throw 'profile partial-load warning missing' }
            $profilesButton = Find-SettingsControl 'Profiles' ([System.Windows.Automation.ControlType]::Button)
            $profilesButton.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Start-Sleep -Milliseconds 750
            Save-SettingsCapture 'gui-profile-partial-warning.png'
            # Replace the directory with a file temporarily. Restore in finally.
            Move-Item $profileDir $profileBackup
            $profileMoved = $true
            [IO.File]::WriteAllText($profileDir,'directory-read-failure-fixture')
            $reload = Find-SettingsControl 'Reload profiles' ([System.Windows.Automation.ControlType]::Button)
            $reload.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Start-Sleep -Milliseconds 750
            $failedWarning = 'Profiles could not be reloaded. The previous list is shown and files were not changed. Reload in Profiles before connecting.'
            if (-not (Find-SettingsControl $failedWarning ([System.Windows.Automation.ControlType]::Text))) { throw 'profile reload failure warning missing' }
            if (-not (Find-SettingsControl 'demo' ([System.Windows.Automation.ControlType]::Text))) { throw 'previous visible profile lost after reload failure' }
            Save-SettingsCapture 'gui-profile-reload-warning.png'
            Remove-Item $profileDir
            Move-Item $profileBackup $profileDir
            $profileMoved = $false
            Remove-Item $badProfile
            $reload = Find-SettingsControl 'Reload profiles' ([System.Windows.Automation.ControlType]::Button)
            $reload.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Start-Sleep -Milliseconds 750
            if (Find-SettingsControl $failedWarning ([System.Windows.Automation.ControlType]::Text)) { throw 'profile reload warning did not clear' }
            if (Find-SettingsControl $profileWarning ([System.Windows.Automation.ControlType]::Text)) { throw 'partial profile warning did not clear' }
            if (-not (Find-SettingsControl 'demo' ([System.Windows.Automation.ControlType]::Text))) { throw 'valid profile missing after read recovery' }
            'PASS partial profile warning; failed reload retained visible list; successful reload cleared warnings' | Out-File verify-results.txt -Append -Encoding utf8
            $features = Find-SettingsControl 'Features' ([System.Windows.Automation.ControlType]::Button)
            $features.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Start-Sleep -Milliseconds 750
            $auto = Find-SettingsControl 'Auto-reconnect' ([System.Windows.Automation.ControlType]::CheckBox)
            if (-not $auto -or $auto.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern).Current.ToggleState -ne [System.Windows.Automation.ToggleState]::Off) { throw 'unreadable settings revived automatic recovery' }
            $motion = Find-SettingsControl 'Reduced motion' ([System.Windows.Automation.ControlType]::CheckBox)
            $motion.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern).Toggle()
            Start-Sleep -Milliseconds 750
            $saveWarning = 'Settings could not be saved. Current choices may not be restored next time you open waX.'
            if (-not (Find-SettingsControl $saveWarning ([System.Windows.Automation.ControlType]::Text))) { throw 'settings save warning missing' }
            if ([Convert]::ToBase64String([IO.File]::ReadAllBytes($path)) -ne [Convert]::ToBase64String($bad)) { throw 'malformed settings original changed' }
            Save-SettingsCapture 'gui-settings-save-warning.png'
            .\bin\wax-vpn.exe --quit
            if ($LASTEXITCODE -ne 0) { throw 'settings fixture quit request failed' }
            if (-not $process.WaitForExit(15000)) { throw 'settings warning fixture quit timed out' }
            'PASS settings malformed original preserved; recovery off; load/save warnings visible; quit' | Out-File verify-results.txt -Append -Encoding utf8
          } finally {
            if ($process -and -not $process.HasExited) { $process.Kill(); $process.WaitForExit() }
            if ($profileMoved) {
              Remove-Item $profileDir -Force -ErrorAction SilentlyContinue
              Move-Item $profileBackup $profileDir
            }
            Remove-Item $badProfile -ErrorAction SilentlyContinue
            if ($had) { [IO.File]::WriteAllBytes($path,$before) } else { Remove-Item $path -ErrorAction SilentlyContinue }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            verify-results.txt
            diagnostics.json
            gui-screenshot.png
            gui-screenshot-profiles.png
            gui-screenshot-features.png
            gui-screenshot-warp.png
            layout-*.png
            layout-state-evidence.txt
            gui-screenshot-diagnostics.png
            gui-screenshot-about.png
            gui-screenshot-connected.png
            gui-screenshot-recovery-cancelled.png
            gui-host-failure.txt
            gui-settings-load-warning.png
            gui-settings-save-warning.png
            gui-profile-partial-warning.png
            gui-profile-reload-warning.png

  installer-smoke:
    name: fresh-runner installer launch
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wax-vpn-installer
          path: installer-download
      - name: Install, launch installed GUI, quit and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:ProgramFiles 'waX VPN'
          if (Test-Path $dir) { throw 'Runner is not clean: waX installation already exists' }
          $setup = Get-ChildItem installer-download -Filter '*.exe' | Select-Object -First 1
          $install = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exit $($install.ExitCode)" }
          $uninstallInfo = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\waX VPN'
          $expectedUninstall = '"' + (Join-Path $dir 'uninstall.exe') + '"'
          Write-Host "Registry UninstallString=[$($uninstallInfo.UninstallString)] QuietUninstallString=[$($uninstallInfo.QuietUninstallString)]"
          if ($uninstallInfo.UninstallString -ne $expectedUninstall -or $uninstallInfo.QuietUninstallString -ne "$expectedUninstall /S") { throw 'Uninstall registry commands must quote paths with spaces' }
          $exe = Join-Path $dir 'waX VPN.exe'
          if (-not (Test-Path $exe)) { throw 'Installed GUI missing' }
          $p = Start-Process $exe -PassThru
          try {
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            $window = $null
            for ($i=0; $i -lt 20 -and -not $window; $i++) {
              Start-Sleep -Seconds 1
              $condition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
              $window = [System.Windows.Automation.AutomationElement]::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Children, $condition)
            }
            if (-not $window -or $window.Current.IsOffscreen) { throw 'Installed GUI main window not on-screen' }
            $name = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Profiles')
            if (-not $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $name)) { throw 'Installed GUI rail missing' }
            Add-Type -AssemblyName System.Drawing
            $r = $window.Current.BoundingRectangle
            $image = New-Object Drawing.Bitmap([int]$r.Width, [int]$r.Height)
            $g = [Drawing.Graphics]::FromImage($image)
            $g.CopyFromScreen([int]$r.X,[int]$r.Y,0,0,$image.Size)
            $image.Save((Join-Path $PWD 'installed-gui.png'))
            $g.Dispose(); $image.Dispose()
            'PASS fresh runner: NSIS install and installed GUI main window with rail' | Out-File installer-results.txt
          } finally {
            & $exe --quit
            for ($i=0; $i -lt 15 -and -not $p.HasExited; $i++) { Start-Sleep -Seconds 1; $p.Refresh() }
            $debugPath = Join-Path $env:APPDATA 'wax-vpn\wax-debug.log'
            if (Test-Path $debugPath) {
              # Only fixed single-instance/cleanup diagnostics, never profile data.
              Get-Content $debugPath | ForEach-Object { Write-Host "QUITDIAG $_" }
              Copy-Item $debugPath installer-quit-diagnostics.txt
            }
            if (-not $p.HasExited) {
              Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $p.Id } | Select-Object ProcessId,ParentProcessId,Name | Format-Table
              $p.Kill(); throw 'Installed GUI did not quit within 15 seconds'
            }
            $uninstall = Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
            Start-Sleep -Seconds 3
            if (Test-Path $exe) { throw 'Uninstall left GUI binary behind' }
            'PASS uninstall removed installed GUI; user data intentionally retained' | Out-File installer-results.txt -Append
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-evidence
          path: |
            installer-results.txt
            installed-gui.png
            installer-quit-diagnostics.txt

  publish:
    needs: [build, verify, installer-smoke]
    if: needs.build.outputs.publish == 'true' && needs.build.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wax-vpn-installer
          path: release-assets
      - name: Upload unsigned signing input
        if: vars.WAX_SIGNPATH_ENABLED == 'true'
        id: signpath-input
        uses: actions/upload-artifact@v4
        with:
          name: wax-signpath-input
          path: release-assets/*.exe
          if-no-files-found: error
      - name: SignPath signing request (disabled until approved setup)
        if: vars.WAX_SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signpath-input.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-assets
      - name: Verify signed installer and replace release asset
        if: vars.WAX_SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = @(Get-ChildItem signed-assets -Recurse -Filter '*.exe')
          if ($signed.Count -ne 1) { throw 'Expected exactly one signed installer' }
          if ((Get-AuthenticodeSignature $signed[0].FullName).Status -ne 'Valid') { throw 'Installer signature is not valid' }
          Copy-Item $signed[0].FullName (Join-Path release-assets $signed[0].Name) -Force
          Get-FileHash -Algorithm SHA256 $signed[0].FullName | ForEach-Object { "$($_.Hash.ToLower())  $($signed[0].Name)" } | Out-File -Encoding ascii (Get-ChildItem release-assets -Filter 'SHA256SUMS-*.txt').FullName
      - name: Publish verified prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem release-assets -Filter 'waX-VPN-Setup-*-x64.exe'
          $tag = $installer.Name -replace '^waX-VPN-Setup-','' -replace '-x64.exe$',''
          $args = @('release','create',$tag) + @(Get-ChildItem release-assets | ForEach-Object FullName) + @('--target','${{ github.sha }}','--title',"waX VPN $tag",'--notes-file','RELEASE_NOTES.md')
          if ($tag -match '-preview\.') { $args += '--prerelease' }
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
