name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Hourly checkpoint builds; skipped automatically when nothing changed.
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: wax-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Skip hourly build when nothing changed
        if: github.event_name == 'schedule'
        id: staleness
        shell: pwsh
        run: |
          $rel = gh release list --limit 20 --json tagName,isPrerelease,targetCommitish | ConvertFrom-Json | Where-Object { $_.tagName -like 'v*-preview.*' } | Select-Object -First 1
          if ($rel -and $rel.targetCommitish -eq "${{ github.sha }}") {
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "HEAD already released as $($rel.tagName); skipping"
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download official WireGuardNT (wireguard.dll)
        if: steps.staleness.outputs.skip != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip" -OutFile wgnt.zip
          Expand-Archive wgnt.zip -DestinationPath vendor\wireguard-nt -Force
          Get-ChildItem -Recurse vendor\wireguard-nt | Format-Table FullName

      - name: Test (workspace)
        if: steps.staleness.outputs.skip != 'true'
        run: cargo test --workspace

      - name: Build release binaries
        if: steps.staleness.outputs.skip != 'true'
        run: cargo build --release --workspace

      - name: Assemble installer payload
        if: steps.staleness.outputs.skip != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer\payload | Out-Null
          Copy-Item "target\release\wax-vpn.exe" "installer\payload\waX VPN.exe"
          Copy-Item "target\release\wax.exe" "installer\payload\wax.exe"
          Copy-Item "vendor\wireguard-nt\wireguard-nt\bin\amd64\wireguard.dll" "installer\payload\wireguard.dll"
          Copy-Item "LICENSE" "installer\payload\LICENSE.txt"
          Copy-Item "assets\icon.ico" "installer\payload\wax.ico"
          Copy-Item "assets\installer-wizard.bmp" "installer\payload\installer-wizard.bmp"
          Copy-Item "assets\installer-header.bmp" "installer\payload\installer-header.bmp"
          Copy-Item "README.md" "installer\payload\README.txt"
          $wgLicense = Get-ChildItem -Recurse vendor\wireguard-nt -Filter "LICENSE*" | Select-Object -First 1
          if ($wgLicense) { Copy-Item $wgLicense.FullName "installer\payload\LICENSE-wireguard-nt.txt" } else { "WireGuardNT prebuilt binaries: see https://git.zx2c4.com/wireguard-nt/about/ (permissive license inside official zip)" | Out-File -Encoding utf8 "installer\payload\LICENSE-wireguard-nt.txt" }

      - name: Install NSIS if needed
        if: steps.staleness.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }

      - name: Build installer
        if: steps.staleness.outputs.skip != 'true'
        shell: pwsh
        run: |
          $version = "0.1.0"
          $tag = "v$version-preview.${{ github.run_number }}"
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) { $nsis = @("C:\Program Files (x86)\NSIS\makensis.exe","C:\Program Files\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $nsis) { throw "makensis not found" }
          & $nsis /DWAX_VERSION="$version-preview.${{ github.run_number }}" installer\wax.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }
          Move-Item "installer\waX-VPN-Setup-$version-preview.${{ github.run_number }}-x64.exe" "waX-VPN-Setup-$tag-x64.exe" -Force
          Get-FileHash -Algorithm SHA256 "waX-VPN-Setup-$tag-x64.exe" | ForEach-Object { "$($_.Hash.ToLower())  waX-VPN-Setup-$tag-x64.exe" } | Out-File -Encoding ascii "SHA256SUMS-$tag.txt"

      - name: Upload raw binaries
        if: steps.staleness.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wax-vpn-binaries
          path: |
            target\release\wax.exe
            target\release\wax-vpn.exe
            installer\payload\wireguard.dll

      - name: Upload installer artifact
        if: steps.staleness.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wax-vpn-installer
          path: |
            waX-VPN-Setup-*.exe
            SHA256SUMS-*.txt

      - name: Decide publication
        id: pub
        if: steps.staleness.outputs.skip != 'true'
        shell: pwsh
        run: |
          $manual = "${{ github.event_name }}" -eq "workflow_dispatch"
          $changed = git diff --name-only HEAD~1 HEAD
          $codeChanged = ($changed | Where-Object { $_ -notmatch '^(\.github/|README|RELEASE_NOTES)' }).Count -gt 0
          if ($manual -or $codeChanged) { "publish=true" | Out-File $env:GITHUB_OUTPUT -Append } else { "publish=false" | Out-File $env:GITHUB_OUTPUT -Append }
          Write-Host "manual=$manual codeChanged=$codeChanged changed: $($changed -join ', ')"

      - name: Publish prerelease
        if: steps.staleness.outputs.skip != 'true' && steps.pub.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v0.1.0-preview.${{ github.run_number }}"
          gh release create $tag "waX-VPN-Setup-$tag-x64.exe" "SHA256SUMS-$tag.txt" --title "waX VPN $tag" --prerelease --notes-file RELEASE_NOTES.md

  verify:
    name: verify (demo tunnel + GUI)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wax-vpn-binaries
          path: dl

      - name: Stage binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory bin -Force | Out-Null
          Copy-Item dl\target\release\wax.exe bin\
          Copy-Item dl\target\release\wax-vpn.exe bin\
          Copy-Item dl\installer\payload\wireguard.dll bin\

      - name: Real tunnel test against the official WireGuard demo server
        env:
          WAX_FULL_VERIFY: ${{ github.event_name != 'push' && '1' || '0' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $results = @()
          function Note($m) { Write-Host $m; $script:results += $m }

          # 1. Register a fresh key with demo.wireguard.com (protocol from
          #    wireguard-tools contrib/ncat-client-server)
          $keyout = .\bin\wax.exe keygen
          $priv = ($keyout | Select-String 'PrivateKey = (.+)$').Matches[0].Groups[1].Value.Trim()
          $pub  = ($keyout | Select-String 'PublicKey\s+= (.+)$').Matches[0].Groups[1].Value.Trim()
          $tcp = New-Object System.Net.Sockets.TcpClient
          $tcp.Connect('demo.wireguard.com', 42912)
          $sw = New-Object System.IO.StreamWriter($tcp.GetStream())
          $sw.NewLine = "`n"
          $sw.WriteLine($pub); $sw.Flush()
          Note "sent pubkey: [$pub]"
          $sr = New-Object System.IO.StreamReader($tcp.GetStream())
          $line = $sr.ReadLine()
          $tcp.Close()
          $parts = $line -split ':'
          if ($parts[0] -ne 'OK') { Note "FAIL demo registration: $line"; exit 1 }
          $serverPub = $parts[1]; $serverPort = $parts[2]; $internalIp = $parts[3]
          Note "PASS demo registration (assigned $internalIp)"

          $conf = @(
            '[Interface]',
            "PrivateKey = $priv",
            "Address = $internalIp/24",
            'DNS = 1.1.1.1, 1.0.0.1',
            '',
            '[Peer]',
            "PublicKey = $serverPub",
            "Endpoint = demo.wireguard.com:$serverPort",
            'AllowedIPs = 0.0.0.0/0',
            'PersistentKeepalive = 25'
          )
          $conf | Out-File -Encoding ascii demo.conf

          .\bin\wax.exe import demo.conf --name demo
          if ($LASTEXITCODE -ne 0) { Note 'FAIL import'; exit 1 }
          Note 'PASS profile import'

          # 2. Connect (runner is elevated). The tunnel lives only while the
          #    owning process is alive, so keep it running in the background.
          $proc = Start-Process -FilePath "$PWD\bin\wax.exe" -ArgumentList 'connect','demo' -PassThru -WindowStyle Hidden -RedirectStandardOutput connect-out.txt -RedirectStandardError connect-err.txt
          Start-Sleep -Seconds 4
          if ($proc.HasExited) { Note "FAIL connect process exited early: $(Get-Content connect-out.txt,connect-err.txt -Raw)"; exit 1 }
          Note "PASS connect process running (pid $($proc.Id))"

          # 3. Wait for a real handshake
          $handshake = $false
          for ($i = 0; $i -lt 18; $i++) {
            Start-Sleep -Seconds 5
            $status = .\bin\wax.exe status
            if ($status -match 'Last handshake') { $handshake = $true; break }
          }
          if ($handshake) { Note "PASS live handshake: $($status -join ' | ')" } else { Note 'FAIL no handshake within 90s' }

          # 3b. Through-tunnel traffic proof: ping the demo server's tunnel-side address
          if ($handshake) {
            $ping = ping -n 2 -w 3000 192.168.4.1
            if ($LASTEXITCODE -eq 0) { Note 'PASS packets traverse the tunnel (ping 192.168.4.1)' } else { Note 'FAIL no traffic through tunnel (ping 192.168.4.1)' }
          }

          # 4. Adapter + DNS state
          $adapter = Get-NetAdapter -Name 'waX VPN' -ErrorAction SilentlyContinue
          if ($adapter -and $adapter.Status -eq 'Up') { Note 'PASS adapter up' } else { Note 'FAIL adapter not up' }
          $dns = Get-DnsClientServerAddress -InterfaceAlias 'waX VPN' -AddressFamily IPv4 -ErrorAction SilentlyContinue
          if ($dns.ServerAddresses -contains '1.1.1.1') { Note 'PASS tunnel DNS applied' } else { Note 'FAIL tunnel DNS missing' }

          # 5. Disconnect and verify restoration
          .\bin\wax.exe disconnect
          if ($LASTEXITCODE -ne 0) { Note 'FAIL disconnect command'; if (-not $proc.HasExited) { $proc.Kill() }; exit 1 }
          Start-Sleep -Seconds 2
          if (-not $proc.HasExited) { $proc.Kill() }
          Start-Sleep -Seconds 3
          $dnsAfter = Get-DnsClientServerAddress -InterfaceAlias 'waX VPN' -AddressFamily IPv4 -ErrorAction SilentlyContinue
          if (-not $dnsAfter -or $dnsAfter.ServerAddresses.Count -eq 0) { Note 'PASS DNS restored on disconnect' } else { Note "FAIL DNS left behind: $($dnsAfter.ServerAddresses -join ',')" }
          $leftRules = Get-NetFirewallRule -DisplayName 'waX VPN KillSwitch*' -ErrorAction SilentlyContinue
          if (-not $leftRules) { Note 'PASS no firewall leftovers' } else { Note 'FAIL firewall leftovers' }

          if ($env:WAX_FULL_VERIFY -eq '1') {
          # 6. Crash leg: kill the tunnel owner mid-connection, then check for residue
          $proc2 = Start-Process -FilePath "$PWD\bin\wax.exe" -ArgumentList 'connect','demo' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 12
          if ($proc2.HasExited) { Note 'WARN crash-leg connect exited early' } else {
            $proc2.Kill()
            Start-Sleep -Seconds 3
            $dnsCrash = Get-DnsClientServerAddress -InterfaceAlias 'waX VPN' -AddressFamily IPv4 -ErrorAction SilentlyContinue
            $adapterCrash = Get-NetAdapter -Name 'waX VPN' -ErrorAction SilentlyContinue
            $rulesPre = Get-NetFirewallRule -DisplayName 'waX VPN KillSwitch*' -ErrorAction SilentlyContinue
            Note ("INFO state 3s after owner kill (before any cleanup): adapter=" + $(if ($adapterCrash) { 'present' } else { 'gone' }) + " dns=" + $(if ($dnsCrash) { ($dnsCrash.ServerAddresses -join ',') } else { 'none' }) + " killSwitchRules=" + $(if ($rulesPre) { $rulesPre.Count } else { 0 }))
            .\bin\wax.exe disconnect | Out-Null
            Start-Sleep -Seconds 2
            $dnsCrashAfter = Get-DnsClientServerAddress -InterfaceAlias 'waX VPN' -AddressFamily IPv4 -ErrorAction SilentlyContinue
            if (-not $dnsCrashAfter -or $dnsCrashAfter.ServerAddresses.Count -eq 0) { Note 'PASS DNS clean after simulated crash + cleanup' } else { Note "FAIL DNS residue after crash: $($dnsCrashAfter.ServerAddresses -join ',')" }
            $rulesCrash = Get-NetFirewallRule -DisplayName 'waX VPN KillSwitch*' -ErrorAction SilentlyContinue
            if (-not $rulesCrash) { Note 'PASS no firewall rules after crash cleanup' } else { Note 'FAIL firewall rules left after crash' }
          }

          # 6b. Crash leg with kill switch ON: rules are system objects and
          #     should PERSIST after the owner dies. This proves rule
          #     persistence only - not that traffic was still blocked.
          $proc3 = Start-Process -FilePath "$PWD\bin\wax.exe" -ArgumentList 'connect','demo','--kill-switch' -PassThru -WindowStyle Hidden -RedirectStandardOutput connect3-out.txt -RedirectStandardError connect3-err.txt
          Start-Sleep -Seconds 12
          if ($proc3.HasExited) { Note 'WARN crash+kill-switch leg connect exited early' } else {
            $proc3.Kill()
            Start-Sleep -Seconds 3
            $rulesDied = Get-NetFirewallRule -DisplayName 'waX VPN KillSwitch*' -ErrorAction SilentlyContinue
            $nDied = if ($rulesDied) { $rulesDied.Count } else { 0 }
            if ($nDied -gt 0) { Note "PASS kill-switch rules persist after owner crash ($nDied rules still in place; traffic blocking itself untested)" } else { Note 'FAIL kill switch rules vanished when owner crashed' }
            .\bin\wax.exe disconnect | Out-Null
            Start-Sleep -Seconds 2
            $rulesAfter = Get-NetFirewallRule -DisplayName 'waX VPN KillSwitch*' -ErrorAction SilentlyContinue
            if (-not $rulesAfter) { Note 'PASS crash+kill-switch cleanup removed all rules' } else { Note 'FAIL crash+kill-switch cleanup left rules' }
          }

          # 7. Kill switch leg: rules exist while connected, removed on disconnect
          $proc3 = Start-Process -FilePath "$PWD\bin\wax.exe" -ArgumentList 'connect','demo','--kill-switch' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 12
          $rulesOn = Get-NetFirewallRule -DisplayName 'waX VPN KillSwitch*' -ErrorAction SilentlyContinue
          if ($rulesOn) { Note "PASS kill switch rules applied while connected ($(($rulesOn | Measure-Object).Count) rules)" } else { Note 'FAIL kill switch rules missing while connected' }
          .\bin\wax.exe disconnect | Out-Null
          Start-Sleep -Seconds 3
          if (-not $proc3.HasExited) { $proc3.Kill() }
          $rulesOff = Get-NetFirewallRule -DisplayName 'waX VPN KillSwitch*' -ErrorAction SilentlyContinue
          if (-not $rulesOff) { Note 'PASS kill switch rules removed on disconnect' } else { Note 'FAIL kill switch rules left behind' }

          } else {
            Note 'INFO extended crash/kill-switch legs skipped on push builds (hourly schedule and manual dispatch run them)'
          }

          $results | Out-File -Encoding utf8 verify-results.txt
          if ($results -match '^FAIL') { exit 1 }

      - name: GUI screenshot (app window only)
        if: always()
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD\bin\wax-vpn.exe" -PassThru
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type -ReferencedAssemblies System.Drawing.Primitives -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public class WaxWin32 {
            [DllImport("user32.dll", SetLastError=true)] public static extern IntPtr FindWindowW(string lpClassName, string lpWindowName);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT lpRect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            public static void SendCtrlDigit(int d) {
              const byte VK_CONTROL = 0x11; const uint KEYUP = 0x0002;
              keybd_event(VK_CONTROL, 0, 0, UIntPtr.Zero);
              keybd_event((byte)(0x30 + d), 0, 0, UIntPtr.Zero);
              keybd_event((byte)(0x30 + d), 0, KEYUP, UIntPtr.Zero);
              keybd_event(VK_CONTROL, 0, KEYUP, UIntPtr.Zero);
            }
          }
          "@
          $hwnd = [IntPtr]::Zero
          for ($i = 0; $i -lt 25 -and $hwnd -eq [IntPtr]::Zero; $i++) {
            Start-Sleep -Seconds 2
            $hwnd = [WaxWin32]::FindWindowW($null, 'waX VPN')
            if ($hwnd -eq [IntPtr]::Zero) { $p.Refresh(); $hwnd = $p.MainWindowHandle }
          }
          Write-Host "window handle: $hwnd (process exited: $($p.HasExited))"
          if ($hwnd -ne [IntPtr]::Zero) {
            [WaxWin32]::SetForegroundWindow($hwnd) | Out-Null
            Start-Sleep -Seconds 2
            $r = New-Object WaxWin32+RECT
            [WaxWin32]::GetWindowRect($hwnd, [ref]$r) | Out-Null
            $w = $r.Right - $r.Left; $h = $r.Bottom - $r.Top
            Write-Host "window rect: $($r.Left),$($r.Top) ${w}x${h}"
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.Left, $r.Top, 0, 0, (New-Object System.Drawing.Size $w, $h))
            $bmp.Save('gui-screenshot.png')
            $g.Dispose(); $bmp.Dispose()
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            $uiaWin = [System.Windows.Automation.AutomationElement]::FromHandle($hwnd)
            $allBtns = $uiaWin.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)))
            Write-Host "buttons in tree: $(@($allBtns | ForEach-Object { $_.Current.Name }) -join ' | ')"
            $marker = @{ Profiles='Profiles'; Features='Features'; WARP='Cloudflare WARP'; About='About' }
            foreach ($tab in @('Profiles','Features','WARP','About')) {
              $nb = $uiaWin.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.AndCondition((New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $tab)), (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)))))
              if (-not $nb) { Write-Error "UIA: no rail button named '$tab' in the app window"; exit 1 }
              $nb.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Start-Sleep -Milliseconds 1500
              $mk = $uiaWin.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.AndCondition((New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $marker[$tab])), (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Text)))))
              if (-not $mk) {
                $allText = $uiaWin.FindAll([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Text)))
                Write-Host "text elements present: $(@($allText | ForEach-Object { $_.Current.Name }) -join ' | ')"
                Write-Error "UIA: heading '$($marker[$tab])' not visible after invoking '$tab' - tab did not switch"
                exit 1
              }
              $bmp2 = New-Object System.Drawing.Bitmap $w, $h
              $g2 = [System.Drawing.Graphics]::FromImage($bmp2)
              $g2.CopyFromScreen($r.Left, $r.Top, 0, 0, (New-Object System.Drawing.Size $w, $h))
              $bmp2.Save("gui-screenshot-$($tab.ToLower()).png")
              $g2.Dispose(); $bmp2.Dispose()
            }
          } else {
            Write-Host 'window not found, full-screen fallback'
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save('gui-screenshot.png')
            $g.Dispose(); $bmp.Dispose()
          }
          if (-not $p.HasExited) { $p.Kill() }

      - name: GUI interaction (UI-driven connect, popups, close-to-tray)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Note($m) { Write-Host $m; $m | Out-File -FilePath verify-results.txt -Append -Encoding utf8 }
          Add-Type -TypeDefinition @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public class WaxCon {
            [DllImport("user32.dll", SetLastError=true)] public static extern IntPtr FindWindowW(string lpClassName, string lpWindowName);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr l);
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern int GetClassNameW(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, IntPtr e);
            [DllImport("user32.dll")] public static extern int GetWindowTextW(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            public static bool AnyWindowVisibleOfPid(uint target) {
              bool found = false;
              EnumWindows((h,l) => {
                uint pid; GetWindowThreadProcessId(h, out pid);
                if (pid == target && IsWindowVisible(h)) found = true;
                return true;
              }, IntPtr.Zero);
              return found;
            }
            public static string ListWindows() {
              var lines = new System.Collections.Generic.List<string>();
              EnumWindows((h,l) => {
                var t = new StringBuilder(128); GetWindowTextW(h, t, 128);
                var c = new StringBuilder(128); GetClassNameW(h, c, 128);
                uint pid; GetWindowThreadProcessId(h, out pid);
                if (t.Length > 0 || IsWindowVisible(h)) lines.Add($"hwnd={h} pid={pid} vis={IsWindowVisible(h)} title='{t}' class='{c}'");
                return true;
              }, IntPtr.Zero);
              return string.Join("\n", lines);
            }
            public static int CountConsoles() {
              int c = 0;
              EnumWindows((h,l) => { var sb = new StringBuilder(256); GetClassNameW(h, sb, 256); if (sb.ToString() == "ConsoleWindowClass" && IsWindowVisible(h)) c++; return true; }, IntPtr.Zero);
              return c;
            }
            public static void RightClick(int x, int y) {
              SetCursorPos(x, y);
              mouse_event(0x0008, 0, 0, 0, IntPtr.Zero);
              mouse_event(0x0010, 0, 0, 0, IntPtr.Zero);
            }
          }
          "@
          Get-Process wax-vpn -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Remove-Item (Join-Path $env:APPDATA 'wax-vpn\wax-debug.log') -ErrorAction SilentlyContinue
          $conBefore = [WaxCon]::CountConsoles()
          # Scoped split-tunnel check: exclude 8.8.8.8/32 for the demo profile
          # (runner-local settings only; no live routes touched beyond the demo tunnel).
          $cfgDir = Join-Path $env:APPDATA 'wax-vpn'
          New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
          Set-Content -Path (Join-Path $cfgDir 'settings.json') -Value '{"split_exclusions":{"demo":"8.8.8.8/32"}}'
          $pg = Start-Process -FilePath "$PWD\bin\wax-vpn.exe" -PassThru
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $ac = 'System.Windows.Automation'
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $win = $null
          for ($i = 0; $i -lt 30 -and -not $win; $i++) {
            Start-Sleep -Seconds 2
            $win = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'waX VPN')))
          }
          if (-not $win) {
            Note 'FAIL GUI window not found for interaction test'
          } else {
            $btn = $null
            for ($i = 0; $i -lt 20 -and -not $btn; $i++) {
              Start-Sleep -Seconds 2
              $ct = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)
              # The rail also has a 'Connect' button; the action button is named for its profile.
              $nm1 = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Connect to demo')
              $nm2 = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Disconnect from demo')
              $nm = New-Object System.Windows.Automation.OrCondition($nm1, $nm2)
              $btn = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.AndCondition($ct, $nm)))
            }
            if (-not $btn) {
              Note 'FAIL Connect button not found through UI Automation'
            } else {
              # Watch console windows continuously while connecting: a
              # before/after count alone would miss a transient flash.
              $watcher = Start-Job -ScriptBlock {
                Add-Type -TypeDefinition @"
                using System;
                using System.Text;
                using System.Runtime.InteropServices;
                public class WaxConW {
                  [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr l);
                  public delegate bool EnumProc(IntPtr h, IntPtr l);
                  [DllImport("user32.dll")] public static extern int GetClassNameW(IntPtr h, StringBuilder s, int n);
                  [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
                  public static int CountConsoles() {
                    int c = 0;
                    EnumWindows((h,l) => { var sb = new StringBuilder(256); GetClassNameW(h, sb, 256); if (sb.ToString() == "ConsoleWindowClass" && IsWindowVisible(h)) c++; return true; }, IntPtr.Zero);
                    return c;
                  }
                }
          "@
                $max = 0
                $sw = [System.Diagnostics.Stopwatch]::StartNew()
                while ($sw.Elapsed.TotalSeconds -lt 150) {
                  $c = [WaxConW]::CountConsoles()
                  if ($c -gt $max) { $max = $c }
                  Start-Sleep -Milliseconds 100
                }
                return $max
              }
              $btn.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              $up = $false
              for ($i = 0; $i -lt 24 -and -not $up; $i++) {
                Start-Sleep -Seconds 5
                $st = .\bin\wax.exe status
                if ($st -match 'Last handshake') { $up = $true }
              }
              if ($up) { Note 'PASS GUI-driven connect: handshake after clicking Connect in the app' } else { Note 'FAIL GUI-driven connect: no handshake within 120s of clicking Connect' }
              if ($up) {
                function Test-IPv4InPrefix([string]$prefix, [string]$ip) {
                  $parts = $prefix -split '/'
                  $plen = [int]$parts[1]
                  if ($plen -eq 0) { return $true }
                  $b = [System.Net.IPAddress]::Parse($parts[0]).GetAddressBytes()
                  $a = [System.Net.IPAddress]::Parse($ip).GetAddressBytes()
                  $bv = ([uint32]$b[0] -shl 24) -bor ([uint32]$b[1] -shl 16) -bor ([uint32]$b[2] -shl 8) -bor $b[3]
                  $av = ([uint32]$a[0] -shl 24) -bor ([uint32]$a[1] -shl 16) -bor ([uint32]$a[2] -shl 8) -bor $a[3]
                  $m = [uint32](([uint64][uint32]::MaxValue -shl (32 - $plen)) -band [uint32]::MaxValue)
                  return (($av -band $m) -eq ($bv -band $m))
                }
                $wr = @(Get-NetRoute -InterfaceAlias 'waX VPN' -AddressFamily IPv4 -ErrorAction SilentlyContinue)
                $covered = @($wr | Where-Object { Test-IPv4InPrefix $_.DestinationPrefix '8.8.8.8' })
                $kept = @($wr | Where-Object { Test-IPv4InPrefix $_.DestinationPrefix '1.1.1.1' })
                $offTunnel = @(Get-NetRoute -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object { $_.InterfaceAlias -ne 'waX VPN' -and (Test-IPv4InPrefix $_.DestinationPrefix '8.8.8.8') })
                if ($wr.Count -gt 10 -and $covered.Count -eq 0 -and $kept.Count -gt 0 -and $offTunnel.Count -gt 0) {
                  Note "PASS split tunneling: $($wr.Count) tunnel routes, none covers 8.8.8.8; 1.1.1.1 still tunnel-routed; 8.8.8.8 resolves via $($offTunnel[0].InterfaceAlias)"
                } else {
                  Note "FAIL split tunneling: routes=$($wr.Count) covers-excluded=$($covered.Count) keeps-1.1.1.1=$($kept.Count) off-tunnel=$($offTunnel.Count)"
                }
              }
              $conAfter = [WaxCon]::CountConsoles()
              $conMax = Receive-Job $watcher -Wait -AutoRemoveJob
              if (($conMax -le $conBefore) -and ($conAfter -le $conBefore)) { Note "PASS no console windows observed during GUI connect (polled every ~100ms; windows shorter than the interval could be missed; baseline=$conBefore peak=$conMax end=$conAfter)" } else { Note "FAIL console window observed during GUI connect (baseline=$conBefore peak=$conMax end=$conAfter)" }
              $mainHwnd = [IntPtr]$win.Current.NativeWindowHandle
              try {
                $win.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern).Close()
              } catch { Note "WARN window Close pattern failed: $($_.Exception.Message)" }
              Start-Sleep -Seconds 4
              if (-not $pg.HasExited) {
                $ad = Get-NetAdapter -Name 'waX VPN' -ErrorAction SilentlyContinue
                if ($ad) { Note 'PASS close-to-tray: app still running and tunnel adapter still up after closing the window' } else { Note 'WARN close-to-tray: app alive after close but adapter is gone' }
              } else {
                Note 'FAIL close-to-tray: app exited when the window was closed'
              }
              # Single instance: a second launch must signal the running instance
              # (window hidden by close-to-tray must reappear), then exit itself.
              $p2 = Start-Process -FilePath "$PWD\bin\wax-vpn.exe" -PassThru
              # Prove the restored window is the actual main UI: find the UIA
              # window by title and require it on-screen with rail content.
              # (A second same-titled helper window never becomes visible, and a
              # bare PID visibility check could pass on a helper.)
              $siVisible = $false
              for ($i = 0; $i -lt 12 -and -not $siVisible; $i++) {
                Start-Sleep -Seconds 1
                $w2 = [System.Windows.Automation.AutomationElement]::FromHandle($mainHwnd)
                if ($w2) {
                  $rail = $w2.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.AndCondition((New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, 'Connect')), (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)))))
                  $siVisible = ($null -ne $rail) -and ($w2.Current.ProcessId -eq $pg.Id) -and [WaxCon]::IsWindowVisible($mainHwnd) -and (-not $w2.Current.IsOffscreen)
                }
              }
              $p2.Refresh(); $pg.Refresh()
              if (-not $pg.HasExited -and $p2.HasExited -and $siVisible) {
                Note 'PASS single instance: original main HWND visible, owned by original PID, Connect rail present and on-screen; second process exited'
              } else {
                Note "FAIL single instance: first-alive=$(-not $pg.HasExited) second-exited=$($p2.HasExited) window-visible=$siVisible"
                $dbg = Get-Content (Join-Path $env:APPDATA 'wax-vpn\wax-debug.log') -ErrorAction SilentlyContinue
                if ($dbg) { $dbg | ForEach-Object { Note "DIAG $_" } } else { Note 'DIAG no show-path diagnostics recorded (signal never consumed?)' }
                [WaxCon]::ListWindows() -split "\n" | ForEach-Object { Note "DIAGWIN $_" }
                if (-not $p2.HasExited) { $p2.Kill() }
              }
              # The runner session has no notification area (Shell_TrayWnd absent), so
              # tray-menu interaction cannot be automated here; it stays a manual check
              # on real Windows. The graceful-quit path itself (same cleanup as tray
              # Quit) is verified through the app's --quit request.
              Note 'INFO tray menu Quit/Open: manual-only on real Windows (runner has no notification area)'
              .\bin\wax-vpn.exe --quit
              for ($i = 0; $i -lt 15 -and -not $pg.HasExited; $i++) { Start-Sleep -Seconds 1 }
              $pg.Refresh()
              if ($pg.HasExited) {
                $ad2 = Get-NetAdapter -Name 'waX VPN' -ErrorAction SilentlyContinue
                if (-not $ad2) { Note 'PASS graceful quit: app exited on --quit request and adapter removed' } else { Note 'FAIL graceful quit: app exited but adapter remains' }
              } else {
                Note 'FAIL graceful quit: app still running 15s after --quit request'
                $dbg2 = Get-Content (Join-Path $env:APPDATA 'wax-vpn\wax-debug.log') -ErrorAction SilentlyContinue
                if ($dbg2) { $dbg2 | ForEach-Object { Note "DIAG $_" } }
                $pg.Kill()
              }
              .\bin\wax.exe disconnect | Out-Null
            }
          }
          if (Get-Content verify-results.txt -ErrorAction SilentlyContinue | Where-Object { $_ -match '^FAIL' }) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            verify-results.txt
            gui-screenshot.png
            gui-screenshot-profiles.png
            gui-screenshot-features.png
            gui-screenshot-warp.png
            gui-screenshot-about.png
